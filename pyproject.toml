[project]
name = "muse-quantile-mapping-study"
version = "0.1.0"
description = "Studies how quantile mapping stabilizes alert rates across model updates, using the public Bank Account Fraud (BAF) dataset."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<2.3",
    "pandas>=2.2,<2.3",
    "scikit-learn>=1.4,<1.6",
    "lightgbm>=4.3,<4.6",
    "matplotlib>=3.8,<3.10",
    "kagglehub>=0.3,<0.4",
    "pyarrow>=18.0,<20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "jupyter>=1.0,<2.0",
    "nbformat>=5.10,<6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/muse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: exercises the full train+fit+eval pipeline on synthetic data (still fast, just heavier than unit tests)",
]
